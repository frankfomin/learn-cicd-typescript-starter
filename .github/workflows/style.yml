name: Style

on:
  pull_request:
    branches: [main]

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
      
      - name: Check formatting
        run: npm run format:check